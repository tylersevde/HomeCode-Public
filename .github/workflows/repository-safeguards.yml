name: Repository safeguards

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safeguards-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safeguards:
    name: Repository safeguards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # actions/checkout v4.3.1; review and pin Dependabot updates to full SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up checksum-pinned standalone scanner
        run: python3 -B tools/repository_safeguards.py --install-scanner
      - name: Check submitted commits and resulting tracked files
        run: python3 -B tools/repository_safeguards.py --event "$GITHUB_EVENT_PATH"
